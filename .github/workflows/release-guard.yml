name: Release guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Tracked-tree guard
        run: bash .github/scripts/release_tree_guard.sh
      - name: Install gitleaks
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      # Scans the checkout, which in CI holds only tracked files; local-only
      # secrets (.env, the bot PEM) never reach it.
      - name: Secret scan
        run: gitleaks dir . --no-banner --redact
