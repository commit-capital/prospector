<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospector</title>
    <script>
      // Set theme before paint to avoid flash. Default: light.
      document.documentElement.dataset.theme = localStorage.getItem("app-theme") || "light";
    </script>
    <style>
      /* The static boot shell inside #root paints before any module loads —
         a hard reload on a lazy route shows this until React's first render
         replaces it. Self-contained styles, since the app stylesheet arrives
         with the bundle; colors mirror styles.css's :root tokens. */
      body { margin: 0; }
      .boot-shell { min-height: 100vh; background: #ffffff;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .boot-topbar { padding: 10px 20px; background: #f6f8fa;
        border-bottom: 1px solid #d1d9e0; font-weight: 700; color: #1f2328; }
      .boot-loading { padding: 24px; color: #59636e; }
      [data-theme="dark"] .boot-shell { background: #0d1117; }
      [data-theme="dark"] .boot-topbar { background: #161b22; border-color: #30363d; color: #e6edf3; }
      [data-theme="dark"] .boot-loading { color: #8b949e; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-topbar">⛏️ Prospector</div>
        <div class="boot-loading">loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
